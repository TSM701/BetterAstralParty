# Builds the native launcher and update helper from this public source on a GitHub-hosted runner.
# Reproducibility check before code signing: the summary lists SHA-256 values to compare with the local build.
# Only cmd and the Windows curl, certutil and tar tools are used; no PowerShell step is part of this workflow.
name: Native build

on:
  workflow_dispatch:
    inputs:
      version:
        description: Product version stamped into the launcher and helper, for example 1.3.0
        required: true

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    defaults:
      run:
        shell: cmd
    env:
      BAP_VERSION: ${{ inputs.version }}
      DOTNET_ADD_GLOBAL_TOOLS_TO_PATH: "false"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate version input
        run: |
          echo %BAP_VERSION%| findstr /r /x "[0-9][0-9]*\.[0-9][0-9]*\.[0-9][0-9]*[-0-9A-Za-z.]*" >nul || (echo Invalid version input & exit /b 1)

      # Full paths: Git for Windows puts GNU tar on PATH, which treats "D:\..." as a remote host.
      - name: Fetch pinned .NET SDK 8.0.425
        run: |
          "%SystemRoot%\System32\curl.exe" -fsSL -o "%RUNNER_TEMP%\sdk.zip" https://builds.dotnet.microsoft.com/dotnet/Sdk/8.0.425/dotnet-sdk-8.0.425-win-x64.zip || exit /b 1
          certutil -hashfile "%RUNNER_TEMP%\sdk.zip" SHA512 | findstr /i /x "f0b6f15bf6f1a0507205c0cb102ab99e1dee875c4682c8ed94665be1d580186a06b21455e83b3a01a0ff7f4cd887b67420f2e2fe09ed985534a4cea488ae1af9" >nul || (echo SDK hash mismatch & exit /b 1)
          mkdir .dotnet && "%SystemRoot%\System32\tar.exe" -xf "%RUNNER_TEMP%\sdk.zip" -C .dotnet || exit /b 1

      - name: Fetch unchanged BepInEx be.788 loader
        run: |
          "%SystemRoot%\System32\curl.exe" -fsSL -o "%RUNNER_TEMP%\bepinex.zip" "https://builds.bepinex.dev/projects/bepinex_be/788/BepInEx-Unity.IL2CPP-win-x64-6.0.0-be.788%%2B5b766a3.zip" || exit /b 1
          certutil -hashfile "%RUNNER_TEMP%\bepinex.zip" SHA256 | findstr /i /x "f4cc496bd098a0df4164b81e3737297707f13a47c2478dba2f60eefab784817a" >nul || (echo BepInEx hash mismatch & exit /b 1)
          mkdir .deps\bepinex && "%SystemRoot%\System32\tar.exe" -xf "%RUNNER_TEMP%\bepinex.zip" -C .deps\bepinex || exit /b 1

      - name: Build launcher and helper
        run: |
          call Developer.cmd build-launcher --version %BAP_VERSION% --output-directory "%GITHUB_WORKSPACE%\artifacts\ci-launcher" || exit /b 1
          call Developer.cmd build-helper --version %BAP_VERSION% --output-directory "%GITHUB_WORKSPACE%\artifacts\ci-helper" || exit /b 1

      - name: Record SHA-256
        run: |
          (echo ## Native build %BAP_VERSION%& echo.& echo ```) >> "%GITHUB_STEP_SUMMARY%"
          certutil -hashfile artifacts\ci-launcher\BetterAstralParty-Launcher.exe SHA256 | findstr /v ":" >> "%GITHUB_STEP_SUMMARY%"
          echo BetterAstralParty-Launcher.exe >> "%GITHUB_STEP_SUMMARY%"
          certutil -hashfile artifacts\ci-helper\BetterAstralParty-UpdateHelper.exe SHA256 | findstr /v ":" >> "%GITHUB_STEP_SUMMARY%"
          echo BetterAstralParty-UpdateHelper.exe >> "%GITHUB_STEP_SUMMARY%"
          echo ``` >> "%GITHUB_STEP_SUMMARY%"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-${{ inputs.version }}
          path: |
            artifacts/ci-launcher/BetterAstralParty-Launcher.exe
            artifacts/ci-helper/BetterAstralParty-UpdateHelper.exe
          if-no-files-found: error
